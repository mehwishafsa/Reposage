<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RepoSage Lite</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#30363d;
    --ink:#e6edf3; --dim:#8b949e; --accent:#7ee787; --accent2:#79c0ff;
    --warn:#f0883e; --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
  h1{font-size:26px;margin:0;letter-spacing:-.5px}
  h1 .s{color:var(--accent)}
  .tag{color:var(--dim);font-size:14px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--accent2);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .askbar{display:flex;gap:10px;margin-bottom:12px}
  #q{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:13px 15px;font-size:15px;outline:none}
  #q:focus{border-color:var(--accent2)}
  button.ask{background:var(--accent);color:#06210e;border:0;border-radius:10px;
    padding:0 22px;font-weight:700;font-size:15px;cursor:pointer}
  button.ask:disabled{opacity:.5;cursor:wait}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .ex{font-size:13px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer}
  .ex:hover{border-color:var(--accent2);color:var(--ink)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel.win{border-color:#2ea04366;box-shadow:0 0 0 1px #2ea04322}
  .ph{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px}
  .ph .dot{width:9px;height:9px;border-radius:50%}
  .good .dot{background:var(--accent)} .bad .dot{background:var(--warn)}
  .sub{font-size:12px;color:var(--dim);font-weight:400}
  .answer{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:14px;font-size:14px;white-space:pre-wrap;margin-bottom:16px}
  .lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);
    margin:16px 0 8px}
  .card{border:1px solid var(--line);border-radius:9px;padding:0;margin-bottom:9px;overflow:hidden}
  .card .top{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel2)}
  .card .nm{font-family:var(--mono);font-size:13px;color:var(--accent2)}
  .card .loc{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
  .badge{font-size:10px;letter-spacing:.4px;padding:2px 7px;border-radius:12px;font-weight:700}
  .b-ret{background:#1f6feb33;color:var(--accent2);border:1px solid #1f6feb66}
  .b-exp{background:#2ea04333;color:var(--accent);border:1px solid #2ea04366}
  pre{margin:0;padding:11px 13px;font-family:var(--mono);font-size:12px;color:#c9d1d9;
    overflow-x:auto;background:#0b0f16;max-height:190px}
  .graphbox{margin-top:8px;padding:12px 14px;background:#0b0f16;border:1px dashed var(--line);
    border-radius:10px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  .graphbox .edge{color:var(--ink);margin:3px 0}
  .graphbox .edge .fn{color:var(--accent)} .graphbox .arr{color:var(--accent2)}
  .empty{color:var(--dim);font-style:italic;font-size:13px}
  .note{color:var(--warn);font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Repo<span class="s">Sage</span></h1>
    <span class="tag">agentic RAG for codebase Q&amp;A</span>
    <span class="chip" id="stats">indexing…</span>
  </header>

  <div class="askbar">
    <input id="q" placeholder="Ask about the codebase…"
      value="What happens end to end when a user logs in?" />
    <button class="ask" id="go" onclick="ask()">Ask</button>
  </div>
  <div class="examples" id="ex"></div>

  <div class="cols">
    <div class="panel win">
      <p class="ph good"><span class="dot"></span> RepoSage
        <span class="sub">· AST chunks + call-graph expansion</span></p>
      <div id="rs"><p class="empty">Ask a question to see grounded, cross-file answers.</p></div>
    </div>
    <div class="panel">
      <p class="ph bad"><span class="dot"></span> Plain keyword search
        <span class="sub">· what grep / vanilla search returns</span></p>
      <div id="kw"><p class="empty">The baseline, for comparison.</p></div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  "What happens end to end when a user logs in?",
  "How are session tokens created?",
  "Where is a new user registered?",
  "How does password verification work?"
];
const exBox = document.getElementById('ex');
EXAMPLES.forEach(t=>{
  const b=document.createElement('div'); b.className='ex'; b.textContent=t;
  b.onclick=()=>{document.getElementById('q').value=t; ask();};
  exBox.appendChild(b);
});

fetch('/stats').then(r=>r.json()).then(s=>{
  document.getElementById('stats').textContent =
    `${s.units} code units · ${s.edges} call-graph edges · ${s.files.length} files`;
});

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function card(c, kind){
  const badge = kind==='exp'
    ? '<span class="badge b-exp">via call graph</span>'
    : '<span class="badge b-ret">retrieved</span>';
  return `<div class="card"><div class="top">
      <span class="nm">${esc(c.name)}()</span>${badge}
      <span class="loc">${esc(c.file)}:${c.start_line}</span></div>
    <pre>${esc(c.source)}</pre></div>`;
}

async function ask(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='…';
  document.getElementById('rs').innerHTML='<p class="empty">Retrieving + walking the call graph…</p>';
  document.getElementById('kw').innerHTML='';
  try{
    const r = await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q})});
    const d = await r.json();

    // RepoSage panel
    let h='';
    if(d.answer){ h+=`<div class="answer">${esc(d.answer)}</div>`; }
    else { h+=`<p class="note">No API key set — showing the retrieved code (the AI answer layer needs ANTHROPIC_API_KEY).</p>`; }

    h+=`<div class="lbl">Semantically retrieved</div>`;
    h+= d.retrieved.map(c=>card(c,'ret')).join('') || '<p class="empty">none</p>';

    h+=`<div class="lbl">Pulled in by following the call graph</div>`;
    h+= d.expanded.length ? d.expanded.map(c=>card(c,'exp')).join('')
        : '<p class="empty">no graph neighbours</p>';

    if(d.subgraph.length){
      h+=`<div class="lbl">How these connect</div><div class="graphbox">`;
      h+= d.subgraph.map(e=>`<div class="edge"><span class="fn">${esc(e.source)}()</span> <span class="arr">→ calls →</span> <span class="fn">${esc(e.target)}()</span></div>`).join('');
      h+=`</div>`;
    }
    document.getElementById('rs').innerHTML=h;

    // Keyword panel
    document.getElementById('kw').innerHTML =
      (d.keyword.map(c=>card(c,'ret')).join('') || '<p class="empty">no matches</p>')
      + `<p class="empty" style="margin-top:12px">↑ flat matches only — no idea these functions call each other.</p>`;
  }catch(e){
    document.getElementById('rs').innerHTML=`<p class="note">Error: ${esc(String(e))}</p>`;
  }
  btn.disabled=false; btn.textContent='Ask';
}
</script>
</body>
</html>
