<script>
"use strict";
/* ============================ 3. MODEL ============================== */

const RAW = JSON.parse(document.getElementById("rs-data").textContent);
const GROUPS = RAW.groups;                    // ["UI","API","Service","Data","Utility","Unclassified","Tests"]
const SHAPES = ["circle", "square", "diamond", "hexagon", "triangle", "circle", "square"];
const KIND_LABEL = { class: "Class", interface: "Interface", enum: "Enum", record: "Record",
                     function: "Function", method: "Method" };

/** Files: one object per file, with its links to other files. */
const files = RAW.files.path.map((path, i) => ({
  i, type: "file", path,
  name: path.slice(path.lastIndexOf("/") + 1),
  dir: path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "",
  lang: RAW.languages[RAW.files.lang[i]],
  group: RAW.files.group[i],
  src: ["guess", "ai", "user"][RAW.files.src[i]],     // who decided the layer
  doc: RAW.files.doc[i], summary: RAW.files.summary[i], ext: RAW.files.ext[i],
  tags: (RAW.files.tags || [])[i] || [],
  stale: (RAW.files.stale || [])[i] === 1,          // changed since it was summarized
  syms: [], out: [], in: [],
}));

/** Symbols: classes, functions and methods. */
const S = RAW.sym;
const syms = S.name.map((name, i) => ({
  i, type: "sym", name, qual: S.qual[i], kind: RAW.kinds[S.kind[i]],
  file: S.file[i], parent: S.parent[i], l0: S.l0[i], l1: S.l1[i],
  sig: S.sig[i], doc: S.doc[i], summary: S.summary[i],
  group: files[S.file[i]].group, out: [], in: [],
}));
syms.forEach(s => files[s.file].syms.push(s.i));

// Calls between symbols: flat array [source, target, confidence, ...]
const callLinks = [];
for (let k = 0; k < RAW.calls.length; k += 3) {
  const link = { s: RAW.calls[k], t: RAW.calls[k + 1], high: RAW.calls[k + 2] === 1 };
  callLinks.push(link);
  syms[link.s].out.push(link);
  syms[link.t].in.push(link);
}
// File dependencies (imports and/or calls): flat [source, target, imports, calls, ...]
const fileLinks = [];
for (let k = 0; k < RAW.flinks.length; k += 4) {
  const link = { s: RAW.flinks[k], t: RAW.flinks[k + 1], imp: RAW.flinks[k + 2] === 1,
                 calls: RAW.flinks[k + 3], high: true };
  fileLinks.push(link);
  files[link.s].out.push(link);
  files[link.t].in.push(link);
}

/** A path with line-break opportunities after each "/" (long Java paths). */
const breakable = p => esc(p).replace(/\//g, "/<wbr>");
const LAYER_SOURCE = { guess: " · guessed from path", ai: "", user: " · set by you" };
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toLocaleString("en-US");
const plural = (n, word) => `${fmt(n)} ${word}${n === 1 ? "" : "s"}`;

/* ============================ 4. MAP ================================ */

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");

const state = {
  view: "files",                 // "files" | "syms"
  mode: "map",                   // "map" | "table"
  hidden: new Set([GROUPS.indexOf("Tests")]),   // groups switched off (tests start hidden)
  showMedium: true,
  showLabels: true,
  selected: null,                // { type: "file"|"sym", i }
  answer: null,                  // the Answer Path being shown, if any
  hover: null,
  query: "",
};
const cam = { x: 0, y: 0, k: 1 };        // screen = (world - cam) * k + centre
let colors = {};                          // canvas colours, read from the CSS tokens

/* ---- Views: the node + link lists for "files" and "symbols" ---------- */

const VIEWS = {
  files: makeView("files", files, fileLinks),
  syms:  makeView("syms", syms, callLinks),
};

function makeView(name, items, links) {
  const degree = new Float32Array(items.length);
  for (const l of links) { degree[l.s]++; degree[l.t]++; }
  const nodes = items.map(it => {
    const d = degree[it.i];
    let r = name === "files"
      ? Math.min(20, 4 + 1.9 * Math.sqrt(d))
      : Math.min(11, 2.5 + 0.9 * Math.sqrt(d)) + (it.kind === "class" || it.kind === "interface" ? 1.5 : 0);
    return { i: it.i, item: it, group: it.group, r, x: 0, y: 0 };
  });
  return { name, items, links, nodes, degree, laidOut: false, bands: null, tree: null };
}

/* ---- Layout: one horizontal band ("stratum") per layer ---------------
   y: each node is held inside its layer's band.
   x: nodes are pulled towards an anchor given by their file's path order,
      so a folder's files sit next to each other, left to right; links
      between nodes pull related code closer together.
   The simulation always runs the same number of steps from the same
   starting positions, so the same graph always gives the same picture. */

function computeBands(view, groups) {
  const area = new Array(GROUPS.length).fill(0);
  const count = new Array(GROUPS.length).fill(0);
  // Room each node needs (its size plus breathing space), per band.
  // Only layers that are switched on take part in the layout.
  for (const n of view.nodes) {
    if (!groups.has(n.group)) continue;
    area[n.group] += (2 * n.r + 8) ** 2 * 3; count[n.group]++;
  }
  const total = area.reduce((a, b) => a + b, 0) || 1;
  const width = Math.max(500, Math.sqrt(total * 1.6));       // a bit wider than tall
  const bands = [];
  let y = 0;
  GROUPS.forEach((g, gi) => {
    const h = count[gi] ? Math.max(90, area[gi] / width + 40) : 0;
    bands.push({ group: gi, top: y, h, count: count[gi] });
    y += h;
  });
  return { list: bands, width };
}

/* Where along the band each node "wants" to be (its x anchor).
   Inside a band, nodes are ordered by folder, then file, then line, and
   laid along the width like books on a shelf: each takes room in
   proportion to its size, and every new folder starts after a small gap.
   So each folder owns one continuous stretch of its band. */
function anchors(view, width) {
  const ax = new Float32Array(view.nodes.length);
  const fileOf = n => (view.name === "files" ? n.item : files[n.item.file]);
  const key = n => fileOf(n).path + "\u0000" + String(view.name === "files" ? 0 : n.item.l0).padStart(7, "0");
  for (let g = 0; g < GROUPS.length; g++) {
    const list = view.nodes.filter(n => n.group === g).sort((a, b) => (key(a) < key(b) ? -1 : 1));
    if (!list.length) continue;
    const GAP = view.name === "files" ? 30 : 16;
    const start = [];
    let pos = 0, lastDir = null;
    for (const n of list) {
      const dir = fileOf(n).dir;
      if (lastDir !== null && dir !== lastDir) pos += GAP;
      lastDir = dir;
      start.push(pos);
      pos += 2 * n.r + 4;
    }
    list.forEach((n, k) => { ax[view.nodes.indexOf(n)] = ((start[k] + n.r + 2) / pos) * width; });
  }
  return ax;
}

function hash(i) {            // small deterministic pseudo-random in [-0.5, 0.5)
  let x = (i + 1) * 2654435761 % 4294967296;
  x ^= x >>> 13; x = x * 1274126177 % 4294967296;
  return (x % 10000) / 10000 - 0.5;
}

function layoutView(view, onDone) {
  const groups = new Set(GROUPS.map((_, g) => g).filter(g => !state.hidden.has(g)));
  const { list, width } = computeBands(view, groups);
  view.bands = list; view.width = width; view.layoutGroups = groups;
  const ax = anchors(view, width);
  const active = view.nodes.filter(n => groups.has(n.group));
  view.nodes.forEach((n, k) => {
    const b = list[n.group];
    n.ax = ax[k];
    n.x = ax[k] + hash(k) * 40;
    n.y = b.top + b.h / 2 + hash(k + 7919) * b.h * 0.6;
    n.vx = n.vy = 0;
  });
  const isFiles = view.name === "files";

  // Keep every node inside its band (a custom d3 force).
  const keepInBand = () => {
    for (const n of active) {
      const b = list[n.group], pad = n.r + 14;
      if (n.y < b.top + pad) { n.y = b.top + pad; n.vy = 0; }
      if (n.y > b.top + b.h - pad) { n.y = b.top + b.h - pad; n.vy = 0; }
      if (n.x < n.r) { n.x = n.r; n.vx = 0; }
      if (n.x > width - n.r) { n.x = width - n.r; n.vx = 0; }
    }
  };
  // Symbols: no many-body repulsion. It is by far the most expensive force
  // (~34 ms per step on gson's 4,000+ symbols) and not needed here: the
  // collision force already stops overlaps, and without repulsion each
  // file's functions settle into a tidy cluster.
  const sim = d3.forceSimulation(active).stop()
    .force("link", linkX(view, groups, isFiles ? 0.12 : 0.06))
    .force("x", d3.forceX(n => n.ax).strength(isFiles ? 0.18 : 0.25))
    .force("y", d3.forceY(n => list[n.group].top + list[n.group].h / 2).strength(isFiles ? 0.12 : 0.01))
    .force("collide", d3.forceCollide(n => n.r + (isFiles ? 3 : 1.5)).iterations(isFiles ? 2 : 1))
    .force("band", keepInBand);
  if (isFiles) sim.force("charge", d3.forceManyBody().strength(-60).theta(0.9).distanceMax(160));

  const TOTAL = isFiles ? 300 : 200;
  sim.alphaDecay(1 - Math.pow(0.001, 1 / TOTAL));   // cool down in exactly TOTAL steps
  view.laying = true;
  const token = view.token = (view.token || 0) + 1;   // a newer layout cancels this one
  let done = 0;
  const busy = document.getElementById("busy");
  function chunk() {
    if (token !== view.token) return;
    const t0 = performance.now();
    while (done < TOTAL && performance.now() - t0 < 40) { sim.tick(); done++; }
    if (done < TOTAL) {
      busy.textContent = `Laying out ${plural(active.length, isFiles ? "file" : "symbol")}… ${Math.round(done / TOTAL * 100)}%`;
      busy.classList.add("on");
      if (view === VIEWS[state.view]) { view.laidOut = true; placeVisible(view); requestDraw(); view.laidOut = false; }
      requestAnimationFrame(chunk);
    } else {
      busy.classList.remove("on");
      view.laidOut = true; view.laying = false;
      placeVisible(view);
      onDone && onDone();
    }
  }
  chunk();
}

/* Links pull connected nodes together SIDEWAYS only. The vertical
   position is decided by the layer, so a link from the UI band down to the
   Data band must not drag nodes out of their bands. */
function linkX(view, groups, strength) {
  const N = view.nodes;
  const links = view.links.filter(l => groups.has(N[l.s].group) && groups.has(N[l.t].group));
  const force = alpha => {
    for (const l of links) {
      const a = N[l.s], b = N[l.t];
      const dx = (b.x + b.vx) - (a.x + a.vx);
      const f = dx * strength * alpha;
      a.vx += f / Math.max(1, view.degree[l.s]);   // busy nodes move less
      b.vx -= f / Math.max(1, view.degree[l.t]);
    }
  };
  return force;
}

/* Hidden layers collapse: the visible bands are stacked without gaps.
   Nodes keep their position inside their band (n.y - band.top). */
/* Above this many links, drawing them all only produces a grey smudge, so
   the map switches to "focus mode": links appear only for the selected node. */
const FOCUS_LIMIT = 3000;

/* Folder outlines: for every folder inside a band, a soft outline around its
   nodes (the convex hull of small circles around each node). */
function convexHull(points) {                 // Andrew's monotone chain
  const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function folderOutlines(view) {
  const byFolder = new Map();              // "group|dir" -> nodes
  for (const n of view.nodes) {
    if (state.hidden.has(n.group) || !view.layoutGroups.has(n.group)) continue;
    const dir = view.name === "files" ? n.item.dir : files[n.item.file].dir;
    const key = n.group + "|" + dir;
    (byFolder.get(key) || byFolder.set(key, []).get(key)).push(n);
  }
  const outlines = [];
  for (const [key, nodes] of byFolder) {
    if (nodes.length < 2) continue;          // a lone node needs no outline
    const pad = view.name === "files" ? 9 : 5;
    const pts = [];
    for (const n of nodes) {
      for (let a = 0; a < 8; a++) {
        const ang = a * Math.PI / 4;
        pts.push([n.px + Math.cos(ang) * (n.r + pad), n.py + Math.sin(ang) * (n.r + pad)]);
      }
    }
    const hull = convexHull(pts);
    const top = hull.reduce((m, p) => (p[1] < m[1] || (p[1] === m[1] && p[0] < m[0]) ? p : m), hull[0]);
    const minX = Math.min(...hull.map(p => p[0])), maxX = Math.max(...hull.map(p => p[0]));
    const dir = key.slice(key.indexOf("|") + 1);
    outlines.push({ hull, labelX: minX, labelY: Math.min(...hull.map(p => p[1])), width: maxX - minX,
                    name: dir ? dir.split("/").slice(-2).join("/") : "(root)", full: dir || "(root)" });
  }
  return outlines;
}

function placeVisible(view) {
  let y = 0;
  view.visTop = [];
  for (const b of view.bands) {
    view.visTop[b.group] = y;
    if (!state.hidden.has(b.group) && b.count) y += b.h;
  }
  view.visHeight = y;
  for (const n of view.nodes) {
    n.px = n.x;
    n.py = n.y - view.bands[n.group].top + view.visTop[n.group];
  }
  const shown = view.nodes.filter(n => !state.hidden.has(n.group));
  view.tree = d3.quadtree(shown, n => n.px, n => n.py);
  view.maxR = shown.reduce((m, n) => Math.max(m, n.r), 0);
  view.outlines = folderOutlines(view);
  view.visibleLinks = view.links.filter(l => !state.hidden.has(view.nodes[l.s].group)
    && !state.hidden.has(view.nodes[l.t].group) && (state.showMedium || l.high)).length;
}

/* ---- Camera ---------------------------------------------------------- */

function size() { return { w: stage.clientWidth, h: stage.clientHeight }; }
const toScreen = (x, y) => { const { w, h } = size(); return [(x - cam.x) * cam.k + w / 2, (y - cam.y) * cam.k + h / 2]; };
const toWorld = (sx, sy) => { const { w, h } = size(); return [(sx - w / 2) / cam.k + cam.x, (sy - h / 2) / cam.k + cam.y]; };

function fit(animate) {
  const view = VIEWS[state.view];
  if (!view.laidOut) return;
  const { w, h } = size();
  const gutter = 110;                      // room for the band labels on the left
  const k = Math.min((w - gutter - 30) / view.width, (h - 40) / Math.max(view.visHeight, 1));
  moveTo(view.width / 2 - gutter / 2 / k, view.visHeight / 2, Math.max(0.02, k), animate);
}

let anim = null;
function moveTo(x, y, k, animate = true) {
  cancelAnimationFrame(anim);
  if (!animate) { cam.x = x; cam.y = y; cam.k = k; requestDraw(); return; }
  const from = { ...cam }, t0 = performance.now(), dur = 320;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - (1 - t) ** 3;
    // zoom in log space so it feels even
    cam.k = Math.exp(Math.log(from.k) + (Math.log(k) - Math.log(from.k)) * e);
    cam.x = from.x + (x - from.x) * e; cam.y = from.y + (y - from.y) * e;
    draw();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function zoomAt(sx, sy, factor) {
  const [wx, wy] = toWorld(sx, sy);
  cam.k = Math.min(12, Math.max(0.02, cam.k * factor));
  const [nx, ny] = toWorld(sx, sy);
  cam.x += wx - nx; cam.y += wy - ny;
  requestDraw();
}

/* ---- Drawing --------------------------------------------------------- */

function readColors() {
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  colors = {
    surface: v("--surface"), band: v("--band"), text: v("--text"), text2: v("--text-2"),
    text3: v("--text-3"), edge: v("--edge-rgb"), layer: GROUPS.map((_, g) => v(`--l${g}`)),
    chg: v("--chg"), aff: v("--aff"),
  };
}

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}

function shapePath(c, shape, x, y, r) {
  switch (shape) {
    case "square": { const s = r * 0.88; c.rect(x - s, y - s, 2 * s, 2 * s); break; }
    case "diamond": c.moveTo(x, y - r * 1.2); c.lineTo(x + r * 1.2, y); c.lineTo(x, y + r * 1.2); c.lineTo(x - r * 1.2, y); c.closePath(); break;
    case "triangle": c.moveTo(x, y - r * 1.2); c.lineTo(x + r * 1.1, y + r * 0.8); c.lineTo(x - r * 1.1, y + r * 0.8); c.closePath(); break;
    case "hexagon":
      for (let a = 0; a < 6; a++) {
        const ang = Math.PI / 3 * a + Math.PI / 6;
        const px = x + Math.cos(ang) * r * 1.08, py = y + Math.sin(ang) * r * 1.08;
        a ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); break;
    default: c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2);
  }
}

/** Which nodes are "lit": the selection, its neighbours and search hits. */
function focusSets(view) {
  const sel = state.selected;
  if (!sel || (sel.type === "file") !== (view.name === "files")) return null;
  const item = view.items[sel.i];
  const out = new Set(), inn = new Set();
  for (const l of item.out) if (state.showMedium || l.high) out.add(l.t);
  for (const l of item.in) if (state.showMedium || l.high) inn.add(l.s);
  return { i: sel.i, out, inn };
}

function draw() {
  const view = VIEWS[state.view];
  const dpr = window.devicePixelRatio || 1;
  const { w, h } = size();
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = colors.surface;
  ctx.fillRect(0, 0, w, h);
  if (!view.bands || !view.nodes.length) return;

  const k = cam.k;
  ctx.save();
  ctx.translate(w / 2, h / 2); ctx.scale(k, k); ctx.translate(-cam.x, -cam.y);

  // World rectangle currently on screen (for skipping off-screen nodes).
  const [x0, y0] = toWorld(0, 0), [x1, y1] = toWorld(w, h);
  const onScreen = n => n.px + n.r > x0 && n.px - n.r < x1 && n.py + n.r > y0 && n.py - n.r < y1;

  // 1. Strata: every other band gets a faint tint.
  let alt = 0;
  for (const b of view.bands) {
    if (!b.count || state.hidden.has(b.group)) continue;
    if (alt++ % 2 === 0) { ctx.fillStyle = colors.band; ctx.fillRect(x0, view.visTop[b.group], x1 - x0, b.h); }
  }

  // 1b. Folder outlines: faint fill + hairline around each folder's nodes.
  ctx.lineJoin = "round";
  ctx.fillStyle = `rgba(${colors.edge}, 0.025)`;
  ctx.strokeStyle = `rgba(${colors.edge}, 0.13)`;
  ctx.lineWidth = 1 / k;
  for (const o of view.outlines || []) {
    ctx.beginPath();
    o.hull.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  const focus = focusSets(view);
  const hidden = state.hidden;
  const N = view.nodes;
  const visibleLink = l => !hidden.has(N[l.s].group) && !hidden.has(N[l.t].group) && (state.showMedium || l.high);

  // 2. Links, in one batched path (faint when something is selected).
  // Fainter lines when there are many, so thousands of links don't turn into a grey mass.
  const alpha = Math.min(0.16, 0.16 * Math.sqrt(600 / Math.max(600, view.links.length)));
  ctx.lineWidth = 1 / k;
  ctx.strokeStyle = `rgba(${colors.edge}, ${focus || state.answer ? alpha / 3 : alpha})`;
  const focusMode = view.visibleLinks > FOCUS_LIMIT;
  if (!focusMode) {
    ctx.beginPath();
    for (const l of view.links) {
      if (!visibleLink(l)) continue;
      const a = N[l.s], b = N[l.t];
      ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py);
    }
    ctx.stroke();
  }
  const note = document.getElementById("focus-note");
  note.classList.toggle("on", focusMode && state.mode === "map");
  if (focusMode) {
    note.innerHTML = `<b>${fmt(view.visibleLinks)} links</b> are too many to draw at once, so the map ` +
      (focus ? "shows only the selected node's connections." : "shows them only for the node you select. <b>Click a node</b> to see its connections.") +
      " Hiding a layer (e.g. Tests) brings the full picture back.";
  }

  // 2b. Links of the selected node: outgoing solid, incoming dashed, with arrowheads.
  if (focus) {
    const item = view.items[focus.i];
    const drawSet = (list, dashed, key) => {
      ctx.setLineDash(dashed ? [5 / k, 4 / k] : []);
      ctx.lineWidth = 1.6 / k;
      ctx.strokeStyle = dashed ? colors.text3 : colors.text;
      ctx.beginPath();
      for (const l of list) {
        if (!visibleLink(l)) continue;
        const a = N[l.s], b = N[l.t];
        ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = dashed ? colors.text3 : colors.text;
      ctx.beginPath();
      for (const l of list) {
        if (!visibleLink(l)) continue;
        const a = N[l.s], b = N[l.t];
        const ang = Math.atan2(b.py - a.py, b.px - a.px), tip = b.r + 2 / k, s = 7 / k;
        const tx = b.px - Math.cos(ang) * tip, ty = b.py - Math.sin(ang) * tip;
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - Math.cos(ang - 0.45) * s, ty - Math.sin(ang - 0.45) * s);
        ctx.lineTo(tx - Math.cos(ang + 0.45) * s, ty - Math.sin(ang + 0.45) * s);
        ctx.closePath();
      }
      ctx.fill();
    };
    drawSet(item.in, true);
    drawSet(item.out, false);
  }

  // 3. Nodes, batched per layer (one fill per colour). A thin ring in the
  //    surface colour separates overlapping marks.
  const hits = searchHits(view);
  const route = routeFor(view);
  const onRoute = route ? new Set(route.map(r => r.i)) : null;
  const impact = diffFor(view);          // change view: role of each affected node
  // 0 = faded, 1 = half (indirectly affected), 2 = normal
  const level = n => {
    if (focus && n.i === focus.i) return 2;
    if (impact) { const r = impact.roles.get(n.i); return !r ? 0 : r.role === "indirect" ? 1 : 2; }
    if (onRoute) return onRoute.has(n.i) ? 2 : 0;
    return !focus || focus.out.has(n.i) || focus.inn.has(n.i) ? 2 : 0;
  };
  const faded = onRoute || impact ? 0.12 : 0.18;
  for (const pass of [0, 1, 2]) {
    if (pass === 0 && !focus && !onRoute && !impact) continue;
    if (pass === 1 && !impact) continue;
    ctx.globalAlpha = [faded, 0.5, 1][pass];
    for (let g = 0; g < GROUPS.length; g++) {
      if (hidden.has(g)) continue;
      ctx.beginPath();
      let any = false;
      for (const n of N) {
        if (n.group !== g || !onScreen(n) || level(n) !== pass) continue;
        shapePath(ctx, SHAPES[g], n.px, n.py, n.r);
        any = true;
      }
      if (!any) continue;
      ctx.fillStyle = colors.layer[g];
      ctx.fill();
      if (k * 5 > 2) { ctx.lineWidth = 1.5 / k; ctx.strokeStyle = colors.surface; ctx.stroke(); }
    }
  }
  ctx.globalAlpha = 1;

  // 3b. Rings: selection (thick), search hits and hover (thin).
  const ring = (n, width, color, gap) => {
    ctx.beginPath(); ctx.arc(n.px, n.py, n.r * 1.25 + gap / k, 0, Math.PI * 2);
    ctx.lineWidth = width / k; ctx.strokeStyle = color; ctx.stroke();
  };
  for (const n of hits) if (!hidden.has(n.group)) ring(n, 1.5, colors.text2, 3);
  if (state.hover && state.hover.view === view) ring(state.hover.node, 1.5, colors.text, 3);
  if (focus) ring(N[focus.i], 2.5, colors.text, 4);

  // 3c. The Answer Path: a bold route from step to step.
  //     solid = a real call, dashed = a guessed call, dotted = no call found
  if (route) drawRoute(route, k);
  // 3d. The change view: ripple links + coloured rings.
  if (impact) drawImpact(impact, k, ring);
  ctx.restore();

  // 3c. Folder names, top-left of each outline, once it is wide enough on screen.
  ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = colors.text3;
  const placed = [];
  for (const o of view.outlines || []) {
    if (o.width * k < 90) continue;
    const [sx, sy] = toScreen(o.labelX, o.labelY);
    if (sx > w || sy < 0 || sy > h) continue;
    const label = (o.name.length > 40 ? "…" + o.name.slice(-39) : o.name) + "/";
    const x = Math.max(sx + 6, 110), y = sy - 3, tw = ctx.measureText(label).width;
    if (tw > o.width * k) continue;                         // wider than its folder
    if (placed.some(r => x < r[1] && x + tw > r[0] && Math.abs(y - r[2]) < 12)) continue;
    placed.push([x - 4, x + tw + 4, y]);
    ctx.fillText(label, x, y);
  }

  // 4. Labels (screen space), most important first, never overlapping.
  if (state.showLabels) drawLabels(view, focus, hits, onScreen);

  // 5. Band names, pinned to the left edge.
  ctx.font = "600 11px " + getComputedStyle(document.body).fontFamily;
  for (const b of view.bands) {
    if (!b.count || hidden.has(b.group)) continue;
    const [, sy] = toScreen(0, view.visTop[b.group]);
    const bh = b.h * k;
    if (sy + bh < 0 || sy > h) continue;
    const y = Math.max(sy + 16, Math.min(sy + bh - 8, 18));
    ctx.fillStyle = colors.layer[b.group];
    ctx.beginPath(); shapePath(ctx, SHAPES[b.group], 16, y - 4, 4.5); ctx.fill();
    ctx.fillStyle = colors.text2;
    const label = `${GROUPS[b.group].toUpperCase()}  ${fmt(b.count)}`;
    ctx.lineWidth = 4; ctx.strokeStyle = colors.surface; ctx.lineJoin = "round";
    ctx.strokeText(label, 28, y); ctx.fillText(label, 28, y);
    if (bh > 24) {  // hairline between strata
      ctx.fillStyle = `rgba(${colors.edge}, 0.08)`; ctx.fillRect(0, sy, w, 1);
    }
  }

  // 6. Numbered badges of the Answer Path / "Δ" on changed code, on top of everything.
  drawRouteBadges(view);
  drawImpactBadges(view);
}

/* ---- Answer Path ------------------------------------------------------
   An answer from /reposage:chat is a list of steps (functions, in the order
   things happen). In the Symbols view each step is a node; in the Files view
   steps are grouped by file. */

function routeFor(view) {
  const ans = state.answer;
  if (!ans || ans.kind === "diff" || !view.laidOut) return null;
  const out = [];
  ans.steps.forEach((st, k) => {
    let i;
    if (view.name === "syms") { if (st.type !== "sym") return; i = st.i; }
    else i = st.type === "file" ? st.i : syms[st.i].file;
    const last = out[out.length - 1];
    if (last && last.i === i) { last.nums.push(k + 1); return; }   // same file twice in a row
    out.push({ i, num: k + 1, nums: [k + 1], hop: k > 0 ? (ans.hops || [])[k - 1] : null });
  });
  return out.length ? out : null;
}

function drawRoute(route, k) {
  const view = VIEWS[state.view], N = view.nodes;
  for (let s = 1; s < route.length; s++) {
    const a = N[route[s - 1].i], b = N[route[s].i];
    const hop = route[s].hop;
    ctx.setLineDash(hop === "medium" ? [8 / k, 5 / k] : hop === "none" ? [2 / k, 5 / k] : []);
    ctx.lineWidth = 3 / k; ctx.strokeStyle = colors.text; ctx.lineCap = "round";
    // a gentle curve, so a route going back and forth stays readable
    const mx = (a.px + b.px) / 2, my = (a.py + b.py) / 2;
    const dx = b.px - a.px, dy = b.py - a.py, len = Math.hypot(dx, dy) || 1;
    const cx = mx - dy / len * Math.min(40, len * 0.15), cy = my + dx / len * Math.min(40, len * 0.15);
    ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.quadraticCurveTo(cx, cy, b.px, b.py); ctx.stroke();
    // arrowhead where the curve reaches b
    const ang = Math.atan2(b.py - cy, b.px - cx), tip = b.r + 12 / k, sz = 9 / k;
    const tx = b.px - Math.cos(ang) * tip, ty = b.py - Math.sin(ang) * tip;
    ctx.setLineDash([]); ctx.fillStyle = colors.text; ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - Math.cos(ang - 0.5) * sz, ty - Math.sin(ang - 0.5) * sz);
    ctx.lineTo(tx - Math.cos(ang + 0.5) * sz, ty - Math.sin(ang + 0.5) * sz);
    ctx.fill();
  }
  ctx.setLineDash([]); ctx.lineCap = "butt";
}

function drawRouteBadges(view) {
  const route = routeFor(view);
  if (!route) return;
  ctx.font = "700 11px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // A node visited more than once (e.g. a file in the Files view) shows all its numbers: "3·5".
  const numbers = new Map();
  for (const r of route) numbers.set(r.i, (numbers.get(r.i) || []).concat(r.nums));
  for (const [i, nums] of numbers) {
    const n = view.nodes[i];
    const [sx, sy] = toScreen(n.px, n.py);
    const text = nums.join("·"), R = 10;
    const half = Math.max(0, ctx.measureText(text).width / 2 - 4);   // pill for "3·5"
    const pill = (pad) => {
      ctx.beginPath();
      ctx.arc(sx - half, sy, R + pad, Math.PI / 2, Math.PI * 1.5);
      ctx.arc(sx + half, sy, R + pad, Math.PI * 1.5, Math.PI / 2);
      ctx.closePath();
    };
    pill(2); ctx.fillStyle = colors.surface; ctx.fill();
    pill(0); ctx.fillStyle = colors.text; ctx.fill();
    ctx.fillStyle = colors.surface; ctx.fillText(text, sx, sy + 0.5);
  }
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

/* ---- Change view (/reposage:diff) -------------------------------------
   changed code = red ring + "Δ", directly affected = violet ring,
   indirectly affected = half faded, everything else faded.
   Links point from the caller to the code it calls; dashed = guessed. */

const ROLE_RANK = { changed: 3, direct: 2, indirect: 1 };

function diffFor(view) {
  const ans = state.answer;
  if (!ans || ans.kind !== "diff" || !view.laidOut) return null;
  if (view.name === "syms") {
    const roles = new Map(ans.nodes.map(n => [n.i, n]));
    return { roles, links: ans.links };
  }
  // Files view: a file takes the strongest role of the code inside it.
  const roles = new Map();
  const put = (fi, info) => {
    const cur = roles.get(fi);
    if (!cur || ROLE_RANK[info.role] > ROLE_RANK[cur.role]) roles.set(fi, info);
  };
  ans.changed_files.forEach(fi => put(fi, { role: "changed", depth: 0 }));
  ans.nodes.forEach(n => put(syms[n.i].file, n));
  const seen = new Set(), links = [];
  for (const l of ans.links) {
    const s = syms[l.s].file, t = syms[l.t].file, key = s + ">" + t;
    if (s !== t && !seen.has(key)) { seen.add(key); links.push({ s, t, high: l.high }); }
  }
  return { roles, links };
}

function drawImpact(impact, k, ring) {
  const N = VIEWS[state.view].nodes;
  for (const l of impact.links) {
    const a = N[l.s], b = N[l.t];
    if (state.hidden.has(a.group) || state.hidden.has(b.group)) continue;
    const role = (impact.roles.get(l.s) || {}).role;
    ctx.globalAlpha = role === "indirect" ? 0.55 : 1;
    ctx.strokeStyle = colors.aff; ctx.fillStyle = colors.aff;
    ctx.lineWidth = 2 / k;
    ctx.setLineDash(l.high ? [] : [6 / k, 4 / k]);
    ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
    const ang = Math.atan2(b.py - a.py, b.px - a.px), tip = b.r + 7 / k, sz = 7 / k;
    const tx = b.px - Math.cos(ang) * tip, ty = b.py - Math.sin(ang) * tip;
    ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.lineTo(tx - Math.cos(ang - 0.5) * sz, ty - Math.sin(ang - 0.5) * sz);
    ctx.lineTo(tx - Math.cos(ang + 0.5) * sz, ty - Math.sin(ang + 0.5) * sz);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const [i, info] of impact.roles) {
    const n = N[i];
    if (state.hidden.has(n.group)) continue;
    if (info.role === "changed") ring(n, 3, colors.chg, 4);
    else if (info.role === "direct") ring(n, 2.5, colors.aff, 3);
    else { ctx.globalAlpha = 0.6; ring(n, 1.5, colors.aff, 3); ctx.globalAlpha = 1; }
  }
}

function drawImpactBadges(view) {
  const impact = diffFor(view);
  if (!impact) return;
  ctx.font = "700 11px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const [i, info] of impact.roles) {
    if (info.role !== "changed") continue;
    const n = view.nodes[i];
    const [sx, sy] = toScreen(n.px, n.py);
    const x = sx - n.r * cam.k - 12, y = sy - n.r * cam.k - 8;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fillStyle = colors.surface; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 8.5, 0, Math.PI * 2); ctx.fillStyle = colors.chg; ctx.fill();
    ctx.fillStyle = colors.surface; ctx.fillText("Δ", x, y + 0.5);
  }
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

function renderDiffBar(ans) {
  const count = role => ans.nodes.filter(n => n.role === role).length;
  const untested = ans.nodes.filter(n => n.role !== "indirect" && !n.tested).length;
  answerBar.innerHTML = `
    <div class="kicker">Change impact <span class="conf">Risk: <span class="risk">${esc(ans.risk)}</span></span>
      <span class="spacer"></span>
      <button class="btn" id="answer-close" title="Back to the full map (Esc)">Close</button></div>
    <div class="q">${esc(ans.question)}</div>
    ${ans.answer ? `<p class="a">${esc(ans.answer)}</p>` : `<p class="a">${esc(ans.reasons[0] || "")}</p>`}
    <div class="route">
      <span class="chip"><span class="dot chg"></span>Changed · ${count("changed")}</span>
      <span class="chip"><span class="dot aff"></span>Directly affected · ${count("direct")}</span>
      <span class="chip"><span class="dot ind"></span>Indirectly affected · ${count("indirect")}</span>
      <span class="chip">${untested ? `⚠ ${untested} with no tests` : "✓ all covered by tests"}</span>
      <span class="chip">- - dashed = guessed link</span>
    </div>`;
  answerBar.classList.add("on");
}

function renderDiffDetail(ans) {
  const row = n => {
    const s = syms[n.i];
    const tests = n.role === "indirect" ? "" : n.tested ? "✓ tested" : "⚠ no tests";
    return `<li><button data-type="sym" data-i="${n.i}">${swatch(s.group)}<span class="t">${esc(s.qual)}</span>
      <span class="m">${esc(tests)}${n.guessed ? " · guessed link" : ""}</span></button></li>`;
  };
  const group = (title, list) => list.length ? `<div class="sub">${esc(title)} · ${list.length}</div><ul class="rel">${list.map(row).join("")}</ul>` : "";
  const byDepth = d => ans.nodes.filter(n => n.depth === d && n.role !== "changed");
  const depths = [...new Set(ans.nodes.map(n => n.depth))].filter(d => d > 0).sort();
  detail.innerHTML = `
    <div class="d-head">
      <div class="d-kind">Change impact · ${esc((ans.created || "").replace("T", " ").slice(0, 16))}</div>
      <h1 class="d-name">Risk: ${esc(ans.risk)}</h1>
      <ul class="reasons">${ans.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    </div>
    ${ans.answer ? `<div class="d-sec"><h2>In plain English</h2><p>${esc(ans.answer)}</p></div>` : ""}
    <div class="d-sec"><h2>What changed</h2>${group("Changed functions", ans.nodes.filter(n => n.role === "changed"))}
      ${ans.removed.length ? `<div class="sub">Removed</div><p class="mono">${esc(ans.removed.join(", "))}</p>` : ""}</div>
    <div class="d-sec"><h2>What could be affected</h2>
      ${depths.map(d => group(d === 1 ? "Directly (calls the changed code)" : `Indirectly, ${d} steps away`, byDepth(d))).join("") || '<p class="placeholder">Nothing else in the repo calls the changed code.</p>'}</div>
    <div class="d-sec"><h2>Tests that exercise it</h2>${ans.tests.length ? `<ul class="rel">${ans.tests.map(t => {
      const it = t.type === "sym" ? { g: syms[t.i].group, name: syms[t.i].qual, where: files[syms[t.i].file].name }
                                  : { g: files[t.i].group, name: files[t.i].name, where: "test file" };
      return `<li><button data-type="${t.type}" data-i="${t.i}">${swatch(it.g)}<span class="t">${esc(it.name)}</span><span class="m">${esc(it.where)}</span></button></li>`;
    }).join("")}</ul>` : '<p class="placeholder">No test reaches the changed code.</p>'}</div>`;
}

function fitImpact() {
  const view = VIEWS[state.view], impact = diffFor(view);
  if (!impact || !impact.roles.size) return fit(true);
  const pts = [...impact.roles.keys()].map(i => view.nodes[i]);
  const xs = pts.map(n => n.px), ys = pts.map(n => n.py);
  const { w, h } = size();
  const top = answerBar.offsetHeight + 40;
  const bw = Math.max(120, Math.max(...xs) - Math.min(...xs)), bh = Math.max(120, Math.max(...ys) - Math.min(...ys));
  const kk = Math.max(0.3, Math.min(2.2, (w - 260) / bw, (h - top - 60) / bh));
  moveTo((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2 - top / 2 / kk, kk);
}

const answerBar = document.getElementById("answer-bar");
const CONFIDENCE = {
  high: "✓ High confidence",
  medium: "~ Medium confidence",
  low: "? Low confidence",
};

function enterAnswer(id) {
  const ans = (RAW.answers || []).find(a => a.id === id);
  if (!ans) return;
  state.answer = ans;
  state.selected = null;
  const sel = document.getElementById("answers");
  sel.value = id;
  // Show the layers the path goes through, even if they were hidden (e.g. Tests).
  const groups = new Set(ans.kind === "diff"
    ? ans.nodes.map(n => syms[n.i].group).concat(ans.changed_files.map(fi => files[fi].group))
    : ans.steps.map(st => (st.type === "sym" ? syms[st.i].group : files[st.i].group)));
  groups.forEach(g => state.hidden.delete(g));
  renderLegend();
  try { history.replaceState(null, "", "#answer=" + encodeURIComponent(id)); } catch (_) {}
  const wanted = ans.kind === "diff" ? (ans.nodes.length ? "syms" : "files")
    : ans.steps.some(st => st.type === "sym") ? "syms" : "files";
  const show = () => { renderAnswerBar(); renderDetail(); ans.kind === "diff" ? fitImpact() : fitRoute(); };
  const v = VIEWS[wanted];
  const needsLayout = !v.laidOut || [...groups].some(g => !v.layoutGroups.has(g));
  if (state.view !== wanted || needsLayout) setView(wanted, show);   // setView lays out if needed
  else show();
}

function exitAnswer() {
  state.answer = null;
  document.getElementById("answers").value = "";
  answerBar.classList.remove("on");
  try { history.replaceState(null, "", location.pathname); } catch (_) {}
  renderDetail(); requestDraw();
}

function fitRoute() {
  const view = VIEWS[state.view], route = routeFor(view);
  if (!route) return;
  const pts = route.map(r => view.nodes[r.i]);
  const xs = pts.map(n => n.px), ys = pts.map(n => n.py);
  const { w, h } = size();
  const top = answerBar.offsetHeight + 40;                 // keep the route below the banner
  const bw = Math.max(80, Math.max(...xs) - Math.min(...xs)), bh = Math.max(80, Math.max(...ys) - Math.min(...ys));
  const kk = Math.max(0.3, Math.min(2.2, (w - 240) / bw, (h - top - 60) / bh));
  moveTo((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2 - top / 2 / kk, kk);
}

function stepItem(st) {
  if (st.type === "sym") {
    const s = syms[st.i];
    return { name: s.qual, loc: `${files[s.file].path}:${s.l0}`, group: s.group };
  }
  const f = files[st.i];
  return { name: f.name, loc: f.path, group: f.group };
}

function renderAnswerBar() {
  const ans = state.answer;
  if (!ans) { answerBar.classList.remove("on"); return; }
  if (ans.kind === "diff") { renderDiffBar(ans); return; }
  const chips = ans.steps.map((st, k) => {
    const it = stepItem(st);
    const hop = k > 0 ? (ans.hops || [])[k - 1] : null;
    const arrow = k === 0 ? "" : `<span class="arrow ${hop === "high" ? "" : "guess"}" title="${
      hop === "high" ? "a real call" : hop === "medium" ? "a guessed call" : "no direct call found"}">${hop === "high" ? "→" : "⇢"}</span>`;
    const cur = state.selected && state.selected.type === st.type && state.selected.i === st.i;
    return `${arrow}<button data-step="${k}" aria-current="${cur}" title="${esc(it.loc)}"><span class="num">${k + 1}</span><span class="t">${esc(it.name)}</span></button>`;
  }).join("");
  answerBar.innerHTML = `
    <div class="kicker">Answer path <span class="conf" title="${esc(ans.confidence_note || "")}">${CONFIDENCE[ans.confidence] || ""}</span>
      <span class="spacer"></span>
      <button class="btn" id="answer-close" title="Back to the full map (Esc)">Close</button></div>
    <div class="q">${esc(ans.question)}</div>
    ${ans.answer ? `<p class="a">${esc(ans.answer)}</p>` : ""}
    <div class="route">${chips}</div>`;
  answerBar.classList.add("on");
}

answerBar.addEventListener("click", e => {
  if (e.target.closest("#answer-close")) { exitAnswer(); return; }
  const b = e.target.closest("button[data-step]");
  if (b) { const st = state.answer.steps[+b.dataset.step]; select({ type: st.type, i: st.i }); renderAnswerBar(); }
});

function renderAnswerDetail() {
  const ans = state.answer;
  if (ans.kind === "diff") { renderDiffDetail(ans); return; }
  const rows = ans.steps.map((st, k) => {
    const it = stepItem(st);
    const hop = k < ans.steps.length - 1 ? (ans.hops || [])[k] : null;
    const hopText = hop === "medium" ? "↓ guessed call (matched by name only)" : hop === "none" ? "↓ no direct call found here" : "";
    return `<li><button data-step="${k}"><span class="num">${k + 1}</span><span>
      <span class="lbl">${esc(st.label || it.name)}</span>
      <span class="loc">${esc(it.name)} · ${breakable(it.loc)}</span></span></button>
      ${hopText ? `<div class="hop">${hopText}</div>` : ""}</li>`;
  }).join("");
  detail.innerHTML = `
    <div class="d-head">
      <div class="d-kind">Answer path · ${esc((ans.created || "").replace("T", " ").slice(0, 16))}</div>
      <h1 class="d-name">${esc(ans.question)}</h1>
      <div class="chips"><span class="chip">${CONFIDENCE[ans.confidence] || ""}</span>
        <span class="chip">${plural(ans.steps.length, "step")}</span></div>
    </div>
    ${ans.answer ? `<div class="d-sec"><h2>Answer</h2><p>${esc(ans.answer)}</p></div>` : ""}
    <div class="d-sec"><h2>How sure is this?</h2><p>${esc(ans.confidence_note || "")}</p></div>
    <div class="d-sec"><h2>Steps</h2><ol class="steps">${rows}</ol></div>`;
}

function labelOf(view, n) {
  return view.name === "files" ? n.item.name : n.item.name + (n.item.kind === "class" ? "" : "()");
}

function drawLabels(view, focus, hits, onScreen) {
  const k = cam.k;
  const cell = new Map();                 // coarse grid of screen cells already used
  const CW = 60, CH = 16;
  const fits = (x, y, wdt) => {
    const c0 = Math.floor(x / CW), c1 = Math.floor((x + wdt) / CW), r0 = Math.floor((y - 11) / CH), r1 = Math.floor((y + 3) / CH);
    for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
      const used = cell.get(c + "," + r);
      if (used && used.some(u => x < u[1] && x + wdt > u[0] && y - 11 < u[3] && y + 3 > u[2])) return false;
    }
    for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
      const key = c + "," + r;
      (cell.get(key) || cell.set(key, []).get(key)).push([x, x + wdt, y - 11, y + 3]);
    }
    return true;
  };
  const important = [];
  const route = routeFor(view);
  if (route) route.forEach(r => important.push(view.nodes[r.i]));
  const impact = diffFor(view);
  if (impact) [...impact.roles.entries()].sort((a, b) => a[1].depth - b[1].depth)
    .forEach(([i]) => important.push(view.nodes[i]));
  if (focus) {
    important.push(view.nodes[focus.i]);
    focus.out.forEach(i => important.push(view.nodes[i]));
    focus.inn.forEach(i => important.push(view.nodes[i]));
  }
  if (state.hover && state.hover.view === view) important.unshift(state.hover.node);
  important.push(...hits);
  // Others: only when zoomed in enough, biggest (most connected) first.
  const minR = view.name === "files" ? 4.5 : 4;
  const rest = view.nodes.filter(n => n.r * k >= minR && !state.hidden.has(n.group) && onScreen(n))
                         .sort((a, b) => b.r - a.r || a.i - b.i).slice(0, 400);
  ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
  ctx.lineJoin = "round";
  const seen = new Set();
  const dimmed = n => focus && !(n.i === focus.i || focus.out.has(n.i) || focus.inn.has(n.i));
  for (const n of important.concat(rest)) {
    if (seen.has(n) || state.hidden.has(n.group) || !onScreen(n)) continue;
    seen.add(n);
    const text = labelOf(view, n);
    const [sx, sy] = toScreen(n.px, n.py);
    const x = sx + n.r * k + 5, y = sy + 4;
    const wdt = ctx.measureText(text).width;
    if (!fits(x, y, wdt)) continue;
    ctx.lineWidth = 3.5; ctx.strokeStyle = colors.surface; ctx.strokeText(text, x, y);
    ctx.fillStyle = dimmed(n) ? colors.text3 : (focus && n.i === focus.i ? colors.text : colors.text2);
    ctx.fillText(text, x, y);
  }
}

/* ---- Pointer: pan, zoom, hover, click --------------------------------- */

function nodeAt(sx, sy) {
  const view = VIEWS[state.view];
  if (!view.tree) return null;
  const [wx, wy] = toWorld(sx, sy);
  const n = view.tree.find(wx, wy, view.maxR + 6 / cam.k);
  if (!n) return null;
  const d = Math.hypot(n.px - wx, n.py - wy);
  return d <= n.r * 1.3 + 4 / cam.k ? n : null;
}

let drag = null;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  drag = { x: e.offsetX, y: e.offsetY, cx: cam.x, cy: cam.y, moved: false };
});
canvas.addEventListener("pointermove", e => {
  if (drag) {
    const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 3) { drag.moved = true; canvas.classList.add("dragging"); hideTip(); }
    if (drag.moved) { cam.x = drag.cx - dx / cam.k; cam.y = drag.cy - dy / cam.k; requestDraw(); }
    return;
  }
  const n = nodeAt(e.offsetX, e.offsetY);
  const view = VIEWS[state.view];
  if ((n && n) !== (state.hover && state.hover.node)) {
    state.hover = n ? { view, node: n } : null;
    canvas.classList.toggle("pointing", !!n);
    requestDraw();
  }
  n ? showTip(view, n, e.offsetX, e.offsetY) : hideTip();
});
canvas.addEventListener("pointerup", e => {
  const wasDrag = drag && drag.moved;
  drag = null; canvas.classList.remove("dragging");
  if (wasDrag) return;
  const n = nodeAt(e.offsetX, e.offsetY);
  select(n ? { type: state.view === "files" ? "file" : "sym", i: n.i } : null, { move: false });
});
canvas.addEventListener("pointerleave", () => { hideTip(); if (state.hover) { state.hover = null; requestDraw(); } });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022));
  zoomAt(e.offsetX, e.offsetY, factor);
}, { passive: false });
canvas.addEventListener("dblclick", e => zoomAt(e.offsetX, e.offsetY, 2));

const tip = document.getElementById("tip");
function showTip(view, n, x, y) {
  const it = n.item;
  const sub = view.name === "files"
    ? `${GROUPS[it.group]} · ${plural(it.syms.length, "symbol")} · uses ${it.out.length} · used by ${it.in.length}`
    : `${KIND_LABEL[it.kind]} in ${files[it.file].path}:${it.l0} · calls ${it.out.length} · called by ${it.in.length}`;
  tip.innerHTML = `<div class="t">${esc(view.name === "files" ? it.path : it.qual)}</div><div class="s">${esc(sub)}</div>`;
  tip.style.display = "block";
  const { w, h } = size();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, w - tw - 8) + "px";
  tip.style.top = (y + 14 + th > h ? y - th - 10 : y + 14) + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ---- Selection + detail panel ----------------------------------------- */

const detail = document.getElementById("detail");

function select(sel, { move = true } = {}) {
  state.selected = sel;
  if (sel) {
    const wanted = sel.type === "file" ? "files" : "syms";
    if (wanted !== state.view) { setView(wanted, () => { centerOn(sel); renderDetail(); }); renderDetail(); return; }
    if (move) centerOn(sel);
  }
  renderDetail();
  if (state.answer) renderAnswerBar();
  if (state.mode === "table") renderTable();
  requestDraw();
}

function centerOn(sel) {
  const view = VIEWS[state.view];
  if (!view.laidOut || !sel) return;
  const n = view.nodes[sel.i];
  if (state.hidden.has(n.group) || !view.layoutGroups.has(n.group)) {
    state.hidden.delete(n.group); renderLegend();
    if (!view.layoutGroups.has(n.group)) { layoutView(view, () => { requestDraw(); centerOn(sel); }); return; }
    placeVisible(view);
  }
  moveTo(n.px, n.py, Math.max(cam.k, view.name === "files" ? 1.1 : 1.6));
}

function swatch(g, size = 12) {
  const r = size / 2 - 1.5, c = size / 2;
  let d;
  switch (SHAPES[g]) {
    case "square": d = `M${c - r * .88} ${c - r * .88}h${r * 1.76}v${r * 1.76}h${-r * 1.76}z`; break;
    case "diamond": d = `M${c} ${c - r * 1.15}L${c + r * 1.15} ${c}L${c} ${c + r * 1.15}L${c - r * 1.15} ${c}z`; break;
    case "triangle": d = `M${c} ${c - r * 1.15}L${c + r * 1.1} ${c + r * .8}L${c - r * 1.1} ${c + r * .8}z`; break;
    case "hexagon": d = Array.from({ length: 6 }, (_, a) => { const ang = Math.PI / 3 * a + Math.PI / 6; return `${a ? "L" : "M"}${(c + Math.cos(ang) * r * 1.08).toFixed(2)} ${(c + Math.sin(ang) * r * 1.08).toFixed(2)}`; }).join("") + "z"; break;
    default: d = `M${c + r} ${c}A${r} ${r} 0 1 1 ${c - r} ${c}A${r} ${r} 0 1 1 ${c + r} ${c}z`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}" fill="var(--l${g})"/></svg>`;
}

function relList(title, rows, limit = 40) {
  if (!rows.length) return "";
  const shown = rows.slice(0, limit).map(r =>
    `<li><button data-type="${r.type}" data-i="${r.i}" title="${esc(r.title || r.label)}">${swatch(r.group)}<span class="t">${esc(r.label)}</span><span class="m">${esc(r.meta || "")}</span></button></li>`).join("");
  const more = rows.length > limit ? `<div class="more">+ ${fmt(rows.length - limit)} more</div>` : "";
  return `<div class="sub">${esc(title)} · ${fmt(rows.length)}</div><ul class="rel">${shown}</ul>${more}`;
}

/** Docstrings are hard-wrapped in the source; join lines back into paragraphs. */
const unwrap = t => t.replace(/([^\n])\n(?!\n)/g, "$1 ").replace(/[ \t]+/g, " ");

function textSection(title, summary, doc, stale) {
  const body = summary
    ? `<p>${esc(summary)}</p>${stale ? '<p class="placeholder">May be out of date: the file changed after this was written. Run /reposage:summarize to refresh it.</p>' : ""}`
    : `<p class="placeholder">No AI summary yet. Run /reposage:summarize to add one.</p>`;
  const docs = doc ? `<div class="sub">From the code's own docs</div><p>${esc(unwrap(doc))}</p>` : "";
  return `<div class="d-sec"><h2>${title}</h2>${body}${docs}</div>`;
}

function editorLink(path, line) {
  return `vscode://file${RAW.root.startsWith("/") ? "" : "/"}${RAW.root}/${path}${line ? ":" + line : ""}`;
}

function renderDetail() {
  const sel = state.selected;
  if (!sel && state.answer) { renderAnswerDetail(); return; }
  if (!sel) {
    detail.innerHTML = `<div class="d-empty"><h3>${esc(RAW.project)}</h3>
      <p>Click any node on the map to see what it is, what it depends on and what depends on it.</p>
      <p>Each horizontal band is an architectural layer: code near the top (UI, API) calls into code further down (Service, Data, Utility).</p>
      <p>Arrows: <b>solid</b> = the selected node uses it · <b>dashed</b> = it uses the selected node.</p></div>`;
    return;
  }
  if (sel.type === "file") {
    const f = files[sel.i];
    const deps = f.out.map(l => ({ type: "file", i: l.t, group: files[l.t].group, label: files[l.t].name, title: files[l.t].path,
                                   meta: l.calls ? plural(l.calls, "call") : "import" }))
                      .sort((a, b) => a.title < b.title ? -1 : 1);
    const users = f.in.map(l => ({ type: "file", i: l.s, group: files[l.s].group, label: files[l.s].name, title: files[l.s].path,
                                   meta: l.calls ? plural(l.calls, "call") : "import" }))
                      .sort((a, b) => a.title < b.title ? -1 : 1);
    const symRows = f.syms.map(i => syms[i]).sort((a, b) => a.l0 - b.l0)
      .map(s => ({ type: "sym", i: s.i, group: s.group, label: s.qual, meta: `${KIND_LABEL[s.kind]} · L${s.l0}` }));
    detail.innerHTML = `
      <div class="d-head">
        <div class="d-kind">${swatch(f.group)} File · ${esc(f.lang)}</div>
        <h1 class="d-name">${esc(f.name)}</h1>
        <div class="d-path mono">${breakable(f.path)}</div>
        <div class="chips">
          <span class="chip">${swatch(f.group)} ${esc(GROUPS[f.group])}${LAYER_SOURCE[f.src]}</span>
          <span class="chip">${plural(f.syms.length, "symbol")}</span>
          ${f.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join("")}
        </div>
        <div class="d-actions">
          ${RAW.root ? `<a class="btn" href="${esc(editorLink(f.path, 1))}">Open in VS Code</a>` : ""}
          <button class="btn" data-copy="${esc(f.path)}">Copy path</button>
        </div>
      </div>
      ${textSection("Summary", f.summary, f.doc, f.stale)}
      <div class="d-sec"><h2>Connections</h2>
        ${relList("Depends on", deps) || '<div class="sub">Depends on no other file in the repo</div>'}
        ${relList("Used by", users) || '<div class="sub">No other file in the repo uses it</div>'}
        ${f.ext.length ? `<div class="sub">External packages · ${f.ext.length}</div><p class="mono muted">${esc(f.ext.join(", "))}</p>` : ""}
      </div>
      <div class="d-sec"><h2>Inside this file</h2>${relList("Classes and functions", symRows, 200) || '<p class="placeholder">No classes or functions.</p>'}</div>`;
  } else {
    const s = syms[sel.i], f = files[s.file];
    const row = (l, other) => ({ type: "sym", i: other, group: syms[other].group, label: syms[other].qual,
                                 title: files[syms[other].file].path + " · " + syms[other].qual,
                                 meta: (l.high ? "" : "guessed · ") + files[syms[other].file].name });
    const calls = s.out.filter(l => state.showMedium || l.high).map(l => row(l, l.t));
    const callers = s.in.filter(l => state.showMedium || l.high).map(l => row(l, l.s));
    const parent = s.parent >= 0 ? syms[s.parent] : null;
    const members = parent ? [] : syms.filter(o => o.parent === s.i)
      .map(o => ({ type: "sym", i: o.i, group: o.group, label: o.name, meta: `${KIND_LABEL[o.kind]} · L${o.l0}` }));
    detail.innerHTML = `
      <div class="d-head">
        <div class="d-kind">${swatch(s.group)} ${KIND_LABEL[s.kind]}${parent ? ` in <b>${esc(parent.name)}</b>` : ""}</div>
        <h1 class="d-name">${esc(s.name)}</h1>
        <div class="d-path mono"><button data-type="file" data-i="${f.i}">${breakable(f.path)}</button>:${s.l0}–${s.l1}</div>
        <div class="chips">
          <span class="chip">${swatch(s.group)} ${esc(GROUPS[s.group])}${LAYER_SOURCE[f.src]}</span>
          <span class="chip">${s.l1 - s.l0 + 1} lines</span>
        </div>
        <div class="d-actions">
          ${RAW.root ? `<a class="btn" href="${esc(editorLink(f.path, s.l0))}">Open in VS Code</a>` : ""}
          <button class="btn" data-copy="${esc(f.path + ":" + s.l0)}">Copy location</button>
        </div>
      </div>
      ${s.sig ? `<div class="d-sec"><h2>Signature</h2><pre class="sig">${esc(s.sig)}</pre></div>` : ""}
      ${textSection("Summary", s.summary, s.doc, f.stale)}
      <div class="d-sec"><h2>Calls</h2>
        ${relList("Calls", calls) || '<div class="sub">Calls nothing else in the repo</div>'}
        ${relList("Called by", callers) || '<div class="sub">Not called from anywhere in the repo</div>'}
      </div>
      ${members.length ? `<div class="d-sec"><h2>Members</h2>${relList("Methods and nested", members, 200)}</div>` : ""}`;
  }
}

detail.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) {
    navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy).then(() => {
      const old = b.textContent; b.textContent = "Copied"; setTimeout(() => (b.textContent = old), 1200);
    });
  } else if (b.dataset.type) {
    select({ type: b.dataset.type, i: +b.dataset.i });
  } else if (b.dataset.step && state.answer) {
    const st = state.answer.steps[+b.dataset.step];
    select({ type: st.type, i: st.i });
  }
});

/* ---- Legend (also the layer filter) ----------------------------------- */

const legend = document.getElementById("legend");
function renderLegend() {
  const view = VIEWS[state.view];
  const counts = GROUPS.map(() => 0);
  view.nodes.forEach(n => counts[n.group]++);
  legend.innerHTML = GROUPS.map((g, gi) => `
    <button class="lg" data-g="${gi}" aria-pressed="${!state.hidden.has(gi)}" ${counts[gi] ? "" : "disabled"}>
      ${swatch(gi, 14)}<span class="name">${esc(g)}</span><span class="n">${fmt(counts[gi])}</span>
    </button>`).join("");
  const byAi = files.filter(f => f.src === "ai").length, byUser = files.filter(f => f.src === "user").length;
  const userNote = byUser ? ` ${fmt(byUser)} set by you in overrides.json.` : "";
  document.getElementById("layer-note").textContent = (byAi === 0
    ? "Layers are guessed from folder and file names. Run /reposage:summarize to have AI classify them."
    : `${fmt(byAi)} of ${fmt(files.length)} files were classified by AI; the rest are guessed from their path (tests stay in Tests).`) + userNote;
}
legend.addEventListener("click", e => {
  const b = e.target.closest(".lg");
  if (!b) return;
  const g = +b.dataset.g;
  state.hidden.has(g) ? state.hidden.delete(g) : state.hidden.add(g);
  for (const v of Object.values(VIEWS)) {
    if (!v.laidOut) continue;
    // A layer that was hidden during layout has no positions yet: lay out again.
    if (!state.hidden.has(g) && !v.layoutGroups.has(g)) {
      v.laidOut = false;
      if (v === VIEWS[state.view]) layoutView(v, () => { fit(true); requestDraw(); });
    } else placeVisible(v);
  }
  renderLegend();
  if (state.mode === "table") renderTable();
  requestDraw();
});

/* ---- Search ------------------------------------------------------------ */

const qInput = document.getElementById("q");
const results = document.getElementById("results");
const index = files.map(f => ({ type: "file", i: f.i, name: f.name.toLowerCase(), path: f.path.toLowerCase(),
                                 text: (f.summary + " " + f.tags.join(" ")).toLowerCase() }))
  .concat(syms.map(s => ({ type: "sym", i: s.i, name: s.name.toLowerCase(), path: (files[s.file].path + "::" + s.qual).toLowerCase(),
                           text: s.summary.toLowerCase() })));

function search(q, limit = 12) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  // "rate limit" also finds a summary that says "RateLimit-Reset": every word
  // (3+ letters) must appear somewhere in the summary, tags or path.
  const words = q.split(/\s+/).filter(w => w.length > 2);
  for (const e of index) if (e.flat === undefined) e.flat = e.text.replace(/[-_]/g, "");
  const scored = [];
  for (const e of index) {
    let score = 0;
    if (e.name === q) score = 100;
    else if (e.name.startsWith(q)) score = 60;
    else if (e.name.includes(q)) score = 40;
    else if (e.path.includes(q)) score = 15;
    else if (words.length && words.every(w => e.text.includes(w) || e.flat.includes(w) || e.path.includes(w))) score = 8;  // summary / tags
    if (score) scored.push([score + (e.type === "file" ? 3 : 0) - e.name.length / 100, e]);
  }
  scored.sort((a, b) => b[0] - a[0] || (a[1].path < b[1].path ? -1 : 1));
  return scored.slice(0, limit).map(x => x[1]);
}

function searchHits(view) {
  if (state.query.trim().length < 2) return [];
  const type = view.name === "files" ? "file" : "sym";
  return search(state.query, 60).filter(e => e.type === type).map(e => view.nodes[e.i]);
}

let active = -1, lastResults = [];
function renderResults() {
  lastResults = search(state.query);
  results.classList.toggle("open", state.query.trim().length > 0);
  qInput.setAttribute("aria-expanded", String(results.classList.contains("open")));
  if (!lastResults.length) { results.innerHTML = `<div class="empty">Nothing matches “${esc(state.query)}”</div>`; return; }
  results.innerHTML = lastResults.map((e, k) => {
    const it = e.type === "file" ? files[e.i] : syms[e.i];
    const title = e.type === "file" ? it.name : it.qual;
    const sub = e.type === "file" ? `File · ${it.dir || "/"}` : `${KIND_LABEL[it.kind]} · ${files[it.file].path}:${it.l0}`;
    return `<button class="result" role="option" aria-selected="${k === active}" data-k="${k}">${swatch(it.group)}<span class="txt"><span class="t">${esc(title)}</span><span class="s">${esc(sub)}</span></span></button>`;
  }).join("");
}
function pick(k) {
  const e = lastResults[k];
  if (!e) return;
  results.classList.remove("open");
  qInput.blur();
  select({ type: e.type, i: e.i });
}
qInput.addEventListener("input", () => { state.query = qInput.value; active = -1; renderResults(); requestDraw(); if (state.mode === "table") renderTable(); });
qInput.addEventListener("focus", () => state.query && renderResults());
qInput.addEventListener("blur", () => setTimeout(() => results.classList.remove("open"), 150));
qInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    active = Math.max(0, Math.min(lastResults.length - 1, active + (e.key === "ArrowDown" ? 1 : -1)));
    renderResults();
  } else if (e.key === "Enter") { pick(active >= 0 ? active : 0); }
  else if (e.key === "Escape") { qInput.value = ""; state.query = ""; renderResults(); results.classList.remove("open"); qInput.blur(); requestDraw(); }
});
results.addEventListener("mousedown", e => { const b = e.target.closest(".result"); if (b) { e.preventDefault(); pick(+b.dataset.k); } });

/* ---- Table view (an accessible alternative to the map) ----------------- */

const tableWrap = document.getElementById("table");
const sortBy = { files: { key: "path", dir: 1 }, syms: { key: "qual", dir: 1 } };
const COLUMNS = {
  files: [
    ["path", "File", f => f.path, 0, f => `<b>${esc(f.name)}</b> <span class="muted">${esc(f.dir)}</span>`],
    ["group", "Layer", f => GROUPS[f.group]], ["lang", "Language", f => f.lang],
    ["syms", "Symbols", f => f.syms.length, 1], ["out", "Depends on", f => f.out.length, 1], ["in", "Used by", f => f.in.length, 1],
  ],
  syms: [
    ["qual", "Name", s => s.qual, 0, s => `<b>${esc(s.qual)}</b>`], ["kind", "Kind", s => KIND_LABEL[s.kind]],
    ["file", "File", s => files[s.file].path, 0, s => `${esc(files[s.file].name)}`],
    ["group", "Layer", s => GROUPS[s.group]], ["out", "Calls", s => s.out.length, 1], ["in", "Called by", s => s.in.length, 1],
  ],
};
function renderTable() {
  const view = VIEWS[state.view], cols = COLUMNS[view.name], sort = sortBy[view.name];
  const col = cols.find(c => c[0] === sort.key);
  const q = state.query.trim().toLowerCase();
  let rows = view.items.filter(it => !state.hidden.has(it.group));
  if (q) rows = rows.filter(it => (view.name === "files" ? it.path : files[it.file].path + "::" + it.qual).toLowerCase().includes(q));
  rows.sort((a, b) => { const x = col[2](a), y = col[2](b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
  const LIMIT = 500, total = rows.length;
  rows = rows.slice(0, LIMIT);
  const sel = state.selected && (state.selected.type === "file") === (view.name === "files") ? state.selected.i : -1;
  tableWrap.innerHTML = `<table><thead><tr>${cols.map(c =>
      `<th class="${c[3] ? "num" : ""}" data-key="${c[0]}" ${c[0] === sort.key ? `aria-sort="${sort.dir > 0 ? "ascending" : "descending"}"` : ""}>${c[1]}${c[0] === sort.key ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(it => `<tr data-i="${it.i}" class="${it.i === sel ? "sel" : ""}">${cols.map((c, ci) =>
      `<td class="${c[3] ? "num" : ""}" ${c[4] ? `title="${esc(c[2](it))}"` : ""}>${ci === 0 ? swatch(it.group) + " " : ""}${c[4] ? c[4](it) : esc(c[2](it))}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="tfoot">${total > LIMIT ? `Showing ${fmt(LIMIT)} of ${fmt(total)}. Type in the search box to narrow down.` : plural(total, "row")}</div>`;
}
tableWrap.addEventListener("click", e => {
  const th = e.target.closest("th");
  if (th) {
    const s = sortBy[state.view];
    if (s.key === th.dataset.key) s.dir *= -1; else { s.key = th.dataset.key; s.dir = th.classList.contains("num") ? -1 : 1; }
    renderTable(); return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (tr) select({ type: state.view === "files" ? "file" : "sym", i: +tr.dataset.i }, { move: false });
});

/* ---- View / mode switches, theme, keys ---------------------------------- */

function setView(name, then) {
  state.view = name;
  document.getElementById("v-files").setAttribute("aria-pressed", String(name === "files"));
  document.getElementById("v-syms").setAttribute("aria-pressed", String(name === "syms"));
  state.hover = null; hideTip();
  renderLegend();
  if (state.mode === "table") renderTable();
  const view = VIEWS[name];
  const stale = view.laidOut && [...GROUPS.keys()].some(g => !state.hidden.has(g) && !view.layoutGroups.has(g));
  // With an Answer Path open, frame the route; otherwise the whole map.
  const frame = () => (state.answer && routeFor(view) ? fitRoute()
                       : state.answer && diffFor(view) ? fitImpact() : fit(false));
  if (view.laidOut && !stale) { placeVisible(view); frame(); then && then(); requestDraw(); }
  else layoutView(view, () => { frame(); then && then(); requestDraw(); });
}
function setMode(mode) {
  state.mode = mode;
  document.getElementById("m-map").setAttribute("aria-pressed", String(mode === "map"));
  document.getElementById("m-table").setAttribute("aria-pressed", String(mode === "table"));
  tableWrap.classList.toggle("on", mode === "table");
  if (mode === "table") renderTable(); else requestDraw();
}
document.getElementById("v-files").onclick = () => setView("files");
document.getElementById("v-syms").onclick = () => setView("syms");
document.getElementById("m-map").onclick = () => setMode("map");
document.getElementById("m-table").onclick = () => setMode("table");
document.getElementById("z-in").onclick = () => { const { w, h } = size(); zoomAt(w / 2, h / 2, 1.5); };
document.getElementById("z-out").onclick = () => { const { w, h } = size(); zoomAt(w / 2, h / 2, 1 / 1.5); };
document.getElementById("z-fit").onclick = () => fit(true);
document.getElementById("opt-medium").onchange = e => {
  state.showMedium = e.target.checked;
  for (const v of Object.values(VIEWS)) if (v.laidOut) placeVisible(v);
  renderDetail(); requestDraw();
};
document.getElementById("opt-labels").onchange = e => { state.showLabels = e.target.checked; requestDraw(); };

document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("reposage-theme", root.dataset.theme); } catch (_) {}
  readColors(); requestDraw();
};
try { const t = localStorage.getItem("reposage-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); requestDraw(); });

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "/") { e.preventDefault(); qInput.focus(); qInput.select(); }
  else if (e.key === "Escape") { if (!state.selected && state.answer) exitAnswer(); else select(null); }
  else if (e.key === "f" || e.key === "F") fit(true);
  else if (e.key === "1") setView("files");
  else if (e.key === "2") setView("syms");
});
new ResizeObserver(() => requestDraw()).observe(stage);

/* ---- Start ------------------------------------------------------------- */

document.title = `${RAW.project} · RepoSage`;
document.getElementById("project").textContent = RAW.project;
document.getElementById("stats").innerHTML =
  `<b>${fmt(files.length)}</b> files · <b>${fmt(syms.length)}</b> symbols · <b>${fmt(callLinks.length)}</b> calls · <b>${fmt(fileLinks.length)}</b> file links`;
readColors();
renderDetail();
setView("files");

// Saved Answer Paths: a menu in the top bar; "#answer=<id>" opens one directly.
const answersMenu = document.getElementById("answers");
if ((RAW.answers || []).length) {
  answersMenu.hidden = false;
  answersMenu.innerHTML = `<option value="">Answers & changes (${RAW.answers.length})</option>` +
    RAW.answers.map(a => `<option value="${esc(a.id)}">${a.kind === "diff" ? "Δ " : ""}${esc(a.question)}</option>`).join("");
  answersMenu.onchange = () => (answersMenu.value ? enterAnswer(answersMenu.value) : exitAnswer());
}
const openFromHash = () => {
  const m = location.hash.match(/answer=([^&]+)/);
  if (m) enterAnswer(decodeURIComponent(m[1]));
};
openFromHash();
window.addEventListener("hashchange", openFromHash);
</script>
