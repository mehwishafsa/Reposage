<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoSage</title>
<!--
  RepoSage dashboard. Generated by `reposage dashboard`; do not edit the
  copy inside .reposage/. The source template lives in
  reposage/dashboard/template.html.

  How it works, in four parts:
    1. STYLE    – colour tokens for light and dark mode
    2. MARKUP   – top bar, left sidebar, the map (a <canvas>), detail panel
    3. MODEL    – decode the compact graph data, work out who links to whom
    4. MAP      – lay nodes out in horizontal "strata" (one band per
                  architectural layer), draw them on the canvas, handle
                  zoom / pan / click / search
-->
<style>
/* ============================ 1. STYLE ============================== */
:root {
  color-scheme: light;
  --bg:        #f3f2ee;   /* page */
  --surface:   #fcfcfb;   /* panels and the map */
  --surface-2: #f6f5f1;   /* hover, chips */
  --band:      rgba(11, 11, 11, 0.028);  /* every other stratum */
  --line:      rgba(11, 11, 11, 0.10);   /* hairlines */
  --text:      #0b0b0b;
  --text-2:    #52514e;
  --text-3:    #7b7a75;
  --edge-rgb:  11, 11, 11;
  /* Layer colours: a validated categorical palette, in stratum order.
     Neighbouring strata never share a similar hue; every layer also has
     its own marker shape, and is labelled on the map. */
  --l0: #2a78d6;  /* UI        blue   ● */
  --l1: #eb6834;  /* API       orange ■ */
  --l2: #1baf7a;  /* Service   aqua   ◆ */
  --l3: #eda100;  /* Data      yellow ⬢ */
  --l4: #e87ba4;  /* Utility   pink   ▲ */
  --l5: #a3a29c;  /* Unclassified (neutral) */
  --l6: #c4c3bd;  /* Tests (neutral) */
  /* Change view (/reposage:diff): validated pair, distinct from the layers */
  --chg: #e34948;  /* changed code */
  --aff: #4a3aa7;  /* directly affected */
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321;
    --band: rgba(255, 255, 255, 0.03); --line: rgba(255, 255, 255, 0.10);
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86; --edge-rgb: 255, 255, 255;
    --l0: #3987e5; --l1: #d95926; --l2: #199e70; --l3: #c98500; --l4: #d55181;
    --l5: #6f6e69; --l6: #4a4946; --chg: #e66767; --aff: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321;
  --band: rgba(255, 255, 255, 0.03); --line: rgba(255, 255, 255, 0.10);
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86; --edge-rgb: 255, 255, 255;
  --l0: #3987e5; --l1: #d95926; --l2: #199e70; --l3: #c98500; --l4: #d55181;
  --l5: #6f6e69; --l6: #4a4946; --chg: #e66767; --aff: #9085e9;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 var(--sans);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.muted { color: var(--text-3); }

/* ---- top bar ---- */
.top {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-size: 14px; letter-spacing: -0.01em; }
.brand .project { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sep { color: var(--text-3); }
.seg {
  display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2);
  border: 1px solid var(--line); flex: none;
}
.seg button {
  border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; cursor: pointer;
  color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.stats { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
.stats b { color: var(--text-2); font-weight: 600; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); }

/* ---- three columns ---- */
.shell { display: grid; grid-template-columns: 272px 1fr 360px; min-height: 0; }
.side, .detail { background: var(--surface); overflow: auto; min-height: 0; }
.side { border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 18px; }
.detail { border-left: 1px solid var(--line); }
h2 {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-3); margin: 0 0 8px;
}

/* ---- search ---- */
.search { position: relative; }
.search input {
  width: 100%; padding: 8px 10px 8px 32px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); font: inherit;
}
.search input::placeholder { color: var(--text-3); }
.search > svg { position: absolute; left: 10px; top: 9px; color: var(--text-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.search kbd {
  position: absolute; right: 8px; top: 7px; font: 11px var(--mono); color: var(--text-3);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
}
.results {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); max-height: 360px; overflow: auto; display: none;
}
.results.open { display: block; }
.result {
  display: flex; gap: 8px; align-items: flex-start;
  width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; cursor: pointer;
}
.result svg { margin-top: 3px; flex: none; }
.result .txt { min-width: 0; display: flex; flex-direction: column; }
.result[aria-selected="true"], .result:hover { background: var(--surface-2); }
.result .t, .result .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result .s { color: var(--text-3); font-size: 11px; }
.results .empty { padding: 10px; color: var(--text-3); }

/* ---- legend / filters ---- */
.legend { display: flex; flex-direction: column; gap: 2px; }
.lg {
  display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
  border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; text-align: left;
}
.lg:hover { background: var(--surface-2); }
.lg[aria-pressed="false"] { opacity: 0.45; }
.lg[aria-pressed="false"] .name { text-decoration: line-through; }
.lg .n { color: var(--text-3); font-variant-numeric: tabular-nums; }
.note { color: var(--text-3); font-size: 12px; margin: 6px 6px 0; }
.check { display: flex; gap: 8px; align-items: center; padding: 4px 6px; color: var(--text-2); cursor: pointer; }
.check input { accent-color: var(--text); }
.keys { color: var(--text-3); font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.keys kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; justify-self: start; }

/* ---- map ---- */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--surface); }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas#map.dragging { cursor: grabbing; }
canvas#map.pointing { cursor: pointer; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.tip {
  position: absolute; pointer-events: none; z-index: 4; max-width: 320px; display: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
}
.tip .t { font-weight: 600; word-break: break-all; }
.tip .s { color: var(--text-3); font-size: 12px; word-break: break-all; }
.busy {
  position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; color: var(--text-2); display: none; white-space: nowrap;
}
.busy.on { display: block; }
.focus-note {
  position: absolute; left: 12px; bottom: 12px; z-index: 3; max-width: 380px; display: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; color: var(--text-2); font-size: 12px;
}
.focus-note.on { display: block; }

/* Answer Path: the route an answer took through the code */
.answer-bar {
  position: absolute; left: 12px; right: 60px; top: 12px; z-index: 4; display: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
}
.answer-bar.on { display: block; }
.answer-bar .kicker { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.answer-bar .kicker .conf { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-2); }
.answer-bar .kicker .spacer { flex: 1; }
.answer-bar .q { font-size: 16px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.01em; }
.answer-bar .a { color: var(--text-2); margin: 0 0 8px; max-height: 3em; overflow: hidden; }
.route { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; }
.route button {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 999px; padding: 2px 10px 2px 3px; cursor: pointer; font-size: 12px; color: var(--text);
  max-width: 260px;
}
.route button span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route button[aria-current="true"] { border-color: var(--text); }
.route .num {
  flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--text); color: var(--surface); font-size: 11px; font-weight: 700;
}
.route .arrow { color: var(--text-3); padding: 0 2px; font-size: 12px; }
.route .arrow.guess { font-style: italic; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li button {
  display: grid; grid-template-columns: 22px 1fr; gap: 10px; width: 100%; text-align: left;
  border: 0; background: none; padding: 8px 6px; margin: 0 -6px; border-radius: 8px; cursor: pointer;
}
.steps li button:hover { background: var(--surface-2); }
.steps .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--text); color: var(--surface); font-size: 12px; font-weight: 700; }
.steps .lbl { display: block; }
.steps .loc { display: block; color: var(--text-3); font-size: 12px; font-family: var(--mono); overflow-wrap: anywhere; }
.steps .hop { color: var(--text-3); font-size: 11px; padding-left: 32px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.chg { background: var(--chg); } .dot.aff { background: var(--aff); }
.dot.ind { background: transparent; border: 2px solid var(--aff); opacity: 0.6; }
.risk { font-weight: 700; color: var(--text); }
.reasons { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); }
.tested { color: var(--text-3); font-size: 11px; }
.top select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 8px; max-width: 240px; }
.focus-note b { color: var(--text); }
.table-wrap { position: absolute; inset: 0; overflow: auto; display: none; background: var(--surface); }
.table-wrap.on { display: block; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; table-layout: fixed; }
th:first-child, td:first-child { width: auto; }
th:not(:first-child), td:not(:first-child) { width: 110px; }
td { overflow: hidden; text-overflow: ellipsis; }
th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--text-3); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
th[aria-sort] { color: var(--text); }
td.num, th.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.sel { background: var(--surface-2); }
.tfoot { padding: 10px 12px; color: var(--text-3); }

/* ---- detail panel ---- */
.d-empty { padding: 28px 22px; color: var(--text-3); }
.d-empty h3 { color: var(--text); font-size: 15px; margin: 0 0 6px; }
.d-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.d-kind { display: flex; gap: 6px; align-items: center; color: var(--text-3); font-size: 12px; margin-bottom: 4px; }
.d-name { font-size: 17px; font-weight: 650; margin: 0; word-break: break-word; letter-spacing: -0.01em; }
.d-path { color: var(--text-2); overflow-wrap: anywhere; margin-top: 4px; }
.d-path button { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); font-size: 12px;
}
.d-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 10px;
  cursor: pointer; color: var(--text-2); text-decoration: none; font-size: 12px;
}
.btn:hover { background: var(--surface-2); color: var(--text); }
.d-sec { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.d-sec p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.d-sec .placeholder { color: var(--text-3); font-style: italic; }
pre.sig {
  margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; border: 1px solid var(--line);
  font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
}
.rel { list-style: none; margin: 0; padding: 0; }
.rel li button {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; width: 100%;
  border: 0; background: none; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; text-align: left;
}
.rel li button:hover { background: var(--surface-2); }
.rel .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel .m { color: var(--text-3); font-size: 11px; max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { color: var(--text-3); font-size: 12px; padding: 4px 0 0; }
.sub { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; }

@media (max-width: 1100px) { .shell { grid-template-columns: 240px 1fr 300px; } }
@media (max-width: 820px) {
  body { overflow: auto; }
  .shell { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { border-left: 0; border-top: 1px solid var(--line); }
  .stats { display: none; }
}
</style>
</head>
<body>
<!-- ============================ 2. MARKUP ============================= -->
<header class="top">
  <div class="brand">
    <!-- RepoSage mark: three offset strata -->
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="2" y="3" width="13" height="4" rx="2" fill="var(--l0)"/>
      <rect x="5" y="9" width="13" height="4" rx="2" fill="var(--l2)"/>
      <rect x="8" y="15" width="12" height="4" rx="2" fill="var(--l4)"/>
    </svg>
    <b>RepoSage</b><span class="sep">/</span><span class="project" id="project"></span>
  </div>
  <div class="seg" role="group" aria-label="What to show">
    <button id="v-files" aria-pressed="true">Files</button>
    <button id="v-syms" aria-pressed="false">Symbols</button>
  </div>
  <div class="seg" role="group" aria-label="How to show it">
    <button id="m-map" aria-pressed="true">Map</button>
    <button id="m-table" aria-pressed="false">Table</button>
  </div>
  <select id="answers" aria-label="Answer Paths" hidden></select>
  <div class="stats" id="stats"></div>
  <button class="icon-btn" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
</header>

<main class="shell">
  <aside class="side">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search files and symbols" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-label="Search files and symbols">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <section>
      <h2>Layers</h2>
      <div class="legend" id="legend"></div>
      <p class="note" id="layer-note"></p>
    </section>
    <section>
      <h2>Show</h2>
      <label class="check"><input type="checkbox" id="opt-medium" checked><span>Guessed calls <span class="muted">· medium confidence</span></span></label>
      <label class="check"><input type="checkbox" id="opt-labels" checked> Labels</label>
    </section>
    <section>
      <h2>Keys</h2>
      <div class="keys">
        <kbd>/</kbd><span>search</span>
        <kbd>F</kbd><span>fit to screen</span>
        <kbd>1</kbd><span>files</span>
        <kbd>2</kbd><span>symbols</span>
        <kbd>Esc</kbd><span>clear selection</span>
      </div>
    </section>
  </aside>

  <section class="stage" id="stage">
    <canvas id="map" role="img" aria-label="Map of the codebase. Use the Table view for an accessible list."></canvas>
    <div class="busy" id="busy" role="status"></div>
    <div class="focus-note" id="focus-note" role="note"></div>
    <div class="answer-bar" id="answer-bar" role="region" aria-label="Answer Path"></div>
    <div class="tip" id="tip"></div>
    <div class="zoom">
      <button class="icon-btn" id="z-in" aria-label="Zoom in">+</button>
      <button class="icon-btn" id="z-out" aria-label="Zoom out">−</button>
      <button class="icon-btn" id="z-fit" aria-label="Fit to screen" title="Fit (F)">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div class="table-wrap" id="table"></div>
  </section>

  <aside class="detail" id="detail" aria-live="polite"></aside>
